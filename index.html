<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>麻雀点数計算</title>
</head>
<body><main>
<header><div><small>RIICHI SCORE · 1.0</small><h1>麻雀点数計算</h1></div><button id="settings" aria-label="ルール設定">⚙ 設定</button></header>
<div id="appTabs" role="tablist" aria-label="アプリ画面">
<button type="button" id="scoreTab" role="tab" aria-selected="true" aria-controls="scorePage">点数計算</button>
<button type="button" id="guideTab" role="tab" aria-selected="false" aria-controls="guidePage" tabindex="-1">麻雀役図鑑</button>
</div>
<div id="scorePage" role="tabpanel" aria-labelledby="scoreTab">
<nav id="modes" aria-label="入力モード"></nav>
<section id="hand"><div id="groups"></div><div id="conditions"><label>場風<select id="round"></select></label><label>自風<select id="seat"></select></label><button id="win">アガリ牌 ＋</button></div><label id="pinfuRow" hidden><input type="checkbox" id="pinfu" checked>平和（符計算に適用）</label></section>
<section id="inputs">
<div class="row"><label>アガリ<select id="method"><option value="ron">ロン</option><option value="tsumo">ツモ</option></select></label><label>親・子<select id="dealer"><option value="child">子</option><option value="dealer">親</option></select></label></div>
<div class="row"><label id="chiRow" hidden>七対子の符<select id="chi"><option>25</option><option>50</option></select></label><label id="fuRow" hidden>符<select id="fu"></select></label><label>合計翻数<input id="han" type="number" inputmode="numeric" min="1" max="99" placeholder="例 3"></label><label>役満<select id="yakuman"><option value="0">通常</option></select></label></div>
</section>
<section id="result" aria-live="polite"></section>
<section>
<details id="analysis"><summary>役解析</summary>
<p>通常手は上の入力を使用します。門前の14枚入力では七対子・国士無双や面子の別解も比較します。</p>
<label><span><input id="useFullHand" type="checkbox">門前の14枚を入力（最後の1枚が和了牌）</span></label>
<label id="fullHandRow" hidden>m＝萬子、p＝筒子、s＝索子、z＝字牌（東南西北白發中）<input id="fullHand" type="text" placeholder="例 1122334455667m 7m" autocapitalize="off" spellcheck="false"></label>
<div class="row" id="analysisWinds" hidden><label>場風<select id="analysisRound"></select></label><label>自風<select id="analysisSeat"></select></label></div>
<label>リーチ<select id="reach"><option value="0">なし</option><option value="1">リーチ</option><option value="2">ダブルリーチ</option></select></label>
<div class="row"><label>ドラ<input id="dora" type="number" min="0" max="99" inputmode="numeric"></label><label>裏ドラ<input id="ura" type="number" min="0" max="99" inputmode="numeric"></label><label>赤ドラ<input id="aka" type="number" min="0" max="99" inputmode="numeric"></label></div>
<details id="yakuCustom"><summary>カスタム ▼</summary>
<label>和了時の状況<select id="yakuEvent"></select></label>
<label><span><input id="ippatsu" type="checkbox">一発</span></label>
<label id="localYakuRow" hidden><span><input id="localYaku" type="checkbox">手の内一盃口を採用（ローカル・1翻）</span></label>
</details>
<div id="yakuResults" aria-live="polite">役解析を読み込み中…</div>
<button id="applyHan" type="button" disabled>翻数に適用</button>
</details>

</section>
<footer><button id="reset">入力リセット</button><button id="update">更新確認</button></footer><p id="status" role="status"></p>
</div>
<div id="guidePage" role="tabpanel" aria-labelledby="guideTab" hidden>
<section>
<div class="row"><label>役名<input id="search" type="search" placeholder="例 平和・ピンフ"></label></div>
<div class="row"><label>種類<select id="type"><option value="">すべて</option><option>通常役</option><option>役満</option><option>ダブル役満</option><option>ローカル役</option></select></label>
<label>翻数・倍率<select id="value"><option value="">すべて</option><option>1翻</option><option>2翻</option><option>3翻</option><option>4翻</option><option>5翻</option><option>6翻</option><option>役満</option><option>ダブル役満</option></select></label></div>
</section>
<p>役満の倍率とローカル役の扱いは卓のルールで異なります。牌は完成形の一例です。金の実線は対子、破線は副露です。槓や流し満貫などは14枚と異なる例を表示します。</p>
<div id="guide"></div>
<p>参考資料　<a href="https://www.nihon-majan.org/ritimajyanyakuitiran.html">日本麻雀連盟</a>・<a href="https://saikouisen.com/pdf/saikouisen_regulation.pdf">最高位戦</a>・<a href="https://www.jannavi.net/yaku/local_yaku/">ジャンナビ</a>・<a href="https://www.mahjong-toryu.com/rule.html">麻雀闘龍</a></p>

</div>
</main>
<dialog id="picker"><div class="sheet"><header><h2 id="pickerTitle"></h2><button id="close">閉じる</button></header><div id="pickerBody"></div></div></dialog>
<script type="module" src="./app.mjs?v=1.0.7"></script>
</body></html>
