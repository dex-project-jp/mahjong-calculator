<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<link rel="stylesheet" href="./style.css">
<title>麻雀役図鑑</title>
</head>
<body><main>
<header><h1>麻雀役図鑑</h1><a href="./index.html">点数計算へ</a></header>
<section>
<div class="row"><label>役名<input id="search" type="search" placeholder="例 平和・ピンフ"></label></div>
<div class="row"><label>種類<select id="type"><option value="">すべて</option><option>通常役</option><option>役満</option><option>ダブル役満</option><option>ローカル役</option></select></label>
<label>翻数・倍率<select id="value"><option value="">すべて</option><option>1翻</option><option>2翻</option><option>3翻</option><option>4翻</option><option>5翻</option><option>6翻</option><option>役満</option><option>ダブル役満</option></select></label></div>
</section>
<p>役満の倍率とローカル役の扱いは卓のルールで異なります。牌は完成形の一例です。金の実線は対子、破線は副露です。槓や流し満貫などは14枚と異なる例を表示します。</p>
<div id="guide"></div>
<p>参考資料　<a href="https://www.nihon-majan.org/ritimajyanyakuitiran.html">日本麻雀連盟</a>・<a href="https://saikouisen.com/pdf/saikouisen_regulation.pdf">最高位戦</a>・<a href="https://www.jannavi.net/yaku/local_yaku/">ジャンナビ</a>・<a href="https://www.mahjong-toryu.com/rule.html">麻雀闘龍</a></p>
</main><script type="module" src="./yaku-guide.mjs"></script></body>
</html>
